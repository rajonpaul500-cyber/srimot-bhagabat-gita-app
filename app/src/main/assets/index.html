<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শ্রীমদ্ভগবদ গীতা যথাযথ | অডিও সহ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./pdfjs/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Galada&family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Kalpurush';
            src: url('file:///android_asset/font/Kalpurush.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --primary-blue: #0369a1; /* Deep Sky Blue */
            --secondary-blue: #075985; /* Darker Blue */
            --accent-sky: #e0f2fe;
            --card-blue: #0ea5e9; /* Vibrant Cyan-Blue */
            --bg-gradient: linear-gradient(180deg, #f0f9ff 0%, #bae6fd 30%, #7dd3fc 60%, #0ea5e9 100%);
            --drawer-gradient: linear-gradient(135deg, #0ea5e9 0%, #0369a1 50%, #075985 100%);
        }
        
        body {
            font-family: 'Kalpurush', 'Noto Sans Bengali', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: #0c4a6e;
            margin: 0;
            padding: 0;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.15) 1px, transparent 0);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        h1, h2, h3, .brand-font {
            font-family: 'Kalpurush', sans-serif;
            font-weight: bold;
        }

        @keyframes flipNext {
            0% { transform: rotateY(0deg); opacity: 1; }
            50% { transform: rotateY(-35deg) scale(0.97); opacity: 0.8; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }

        @keyframes flipPrev {
            0% { transform: rotateY(0deg); opacity: 1; }
            50% { transform: rotateY(35deg) scale(0.97); opacity: 0.8; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }

        .floating-header {
            background: linear-gradient(90deg, var(--primary-blue), var(--secondary-blue));
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(3, 105, 161, 0.4);
            z-index: 4000;
        }

        .fixed-bottom-nav {
            background-color: #0c4a6e;
            border-radius: 50px;
            box-shadow: 0 8px 30px rgba(12, 74, 110, 0.5);
            z-index: 4000;
        }

        /* Glassy 3D Card Style */
        .card-3d {
            background-color: rgba(14, 165, 233, 0.65); 
            backdrop-filter: blur(8px);
            border-radius: 12px;
            box-shadow: 0 4px 0px rgba(3, 105, 161, 0.8); 
            transition: all 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            position: relative;
            overflow: hidden;
        }
        
        .card-3d:active {
            transform: scale(0.92) translateY(2px);
            box-shadow: 0 1px 0px rgba(3, 105, 161, 0.8);
        }

        .drawer-card {
            background: var(--drawer-gradient);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .icon-shadow {
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }

        .icon-glow {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Subtle Round Shade Effect */
        .icon-glow::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140%;
            height: 140%;
            background: radial-gradient(circle, rgba(0, 71, 115, 0.25) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
            border-radius: 50%;
        }

        .bird-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            opacity: 0.2;
        }
        
        .bird {
            position: absolute;
            width: 40px;
            height: 40px;
            background: url('file:///android_asset/Image/sticker/bird.gif') no-repeat center/contain;
            animation: fly linear infinite;
        }
        
        @keyframes fly {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(120vw); }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-blue);
            border-radius: 10px;
        }
    </style>
